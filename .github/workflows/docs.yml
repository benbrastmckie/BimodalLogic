name: API Documentation

# Builds the doc-gen4 API documentation for FormalSystem and deploys it to GitHub Pages at
# https://benbrastmckie.github.io/BimodalLogic/docs/ (module pages such as
# docs/FormalSystem.html; the site root redirects there).
#
# PREREQUISITES (each one was a cause of this workflow failing before):
#   - `lakefile.toml`. leanprover-community/docgen-action reads the package `name` and
#     `defaultTargets` from `lakefile.toml` only, with no fallback for a Lean-syntax lakefile.
#     The package name it reads is the Lake package (`BimodalLogic`), not the library.
#   - `leanprover/lean-action` runs FIRST. docgen-action installs neither elan nor the Mathlib
#     cache itself; it calls `~/.elan/bin/lake` and expects the project to be built already.
#   - Pages source = "GitHub Actions" (Settings -> Pages -> Build and deployment -> Source).
#     A workflow cannot set this for itself; until it is set the deploy step has nowhere to
#     publish. The first step checks it and fails fast.
#   - A `push` event. The action builds the API docs and deploys only on push; a
#     `workflow_dispatch` run exercises the setup steps but publishes nothing.
#   - Unrestricted overcommit (`vm.overcommit_memory=1`), set by the "Allow memory overcommit"
#     step. The doc build runs `lake build` over roughly 6,300 doc targets and spawns a child
#     process for most of them. Under the runner's default heuristic overcommit
#     (`vm.overcommit_memory=0`) those spawns fail with
#     `error: resource exhausted (error code: 12, cannot allocate memory)` while physical memory
#     is plentiful: run 44839249624 failed with 12.6 GiB available and 16 GiB of swap unused,
#     at a peak `Committed_AS` of 40.9 GiB against a `CommitLimit` of 23.7 GiB. The kernel is
#     refusing the fork on commit accounting, not on memory. The failure summary names
#     whichever `srcUri.github` targets were in flight; those cheap `git` subprocesses are the
#     symptom, and no URI or git configuration is involved.
#
#     The swap step and the memory sampler are kept as instrumentation: their `free -h` output
#     and the `Committed_AS`/`CommitLimit` trace make any shortfall name itself in the log.
#
#     Routes that do not address the failure, each measured:
#       - `LEAN_NUM_THREADS: "1"` caps the in-process thread pool, not the external-process
#         fan-out: run 44492038639 produced 48 allocation errors with it set, against 13 and 15
#         without.
#       - Swap alone. 16 GiB of swap beside 15 GiB of RAM raises `CommitLimit` to 23.7 GiB,
#         still below the build's committed peak.
#       - A larger GitHub-hosted runner is unavailable to a personal-account repository.
#       - Lake 5.0.0 accepts no `-j`/`--jobs` flag, and the doc build's `lake build` call lives
#         inside the pinned action's `scripts/build_docs.sh`.
#
#     If a run still fails on memory with overcommit unrestricted, the next route is to drive
#     `doc-gen4`'s own `single`/`fromDb` subcommands over `find FormalSystem -name '*.lean'`
#     with an explicit `xargs -P N`, as `linglib-community/linglib` does (its commit
#     `97ec249684`; the CLI surface is present at `doc-gen4` tag `v4.33.0-rc1`, the tag
#     `build_docs.sh`'s `determine_doc_gen_rev` resolves to for this `lean-toolchain`).
#   - A docs cache that is only ever written whole. `docgen-action` caches the dependency docs
#     under `Docs-<hash of lake-manifest.json and references.bib>` and saves it only on job
#     success. Cache keys are immutable, so an entry saved from a failed or partial build is
#     restored on every later run and never replaced. The "Persist the Mathlib docs cache" step
#     below saves under the same key after a failed build only when the Mathlib docs are
#     at least 95% complete; a smaller result is left unsaved. To discard a bad entry:
#     `gh cache delete <key>`.
#
#     Path-list maintenance: that step's `path:` list is copied from `docgen-action`'s own
#     echoed `path:` input, not derived. It includes `Archive` and `Counterexamples`, which are
#     not `lake-manifest.json` packages. Revisit the list after any `lake update` that changes
#     the dependency set.
#
# The action supplies doc-gen4 itself (a throwaway `docbuild/` package pinned to the doc-gen4
# tag matching `lean-toolchain`), which is why `lakefile.toml` and `lake-manifest.json` carry no
# doc-gen4 dependency and must not acquire one: adding it would put doc-gen4 into every
# contributor's `lake build` for the sake of a job that only runs here.
#
# `homepage: api-site` and `build-page: false` are load-bearing, not defaults being restated.
# The action copies the generated API into `<homepage>/docs` and uploads the whole `<homepage>`
# folder. Its default `homepage` is `docs`, which in this repository is a hand-maintained tree of
# markdown files: the default would publish that tree with the API nested at `/docs/docs/`.
# `api-site` is a folder that does not exist in the repository, created only inside this job, so
# the published site holds the API documentation and the one-line redirect written below, and
# nothing else. `build-page: false` skips the Jekyll build, since there is no Jekyll site. The
# upgrade path, if a landing page is ever wanted, is a real Jekyll site in a new folder named by
# `homepage` -- never `docs`.
#
# docgen-action is pinned to a commit SHA rather than `@main`, so an upstream change cannot alter
# what this job publishes without a reviewed edit here.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes an older queued run but never cancels a
# deploy already in flight.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  docs:
    name: Build and deploy API documentation
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.docgen.outputs.page_url }}

    steps:
      # Fail in seconds, not after the ~90-minute doc build, when the Pages prerequisite above is
      # unmet: deploy-pages otherwise reports only an opaque `HttpError: Not Found` at the very
      # last step. `pages: write` covers this read.
      - name: Check GitHub Pages is enabled with source "GitHub Actions"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type); then
            echo "::error::GitHub Pages is not enabled. Settings -> Pages -> Source = GitHub Actions, or: gh api -X POST repos/${GITHUB_REPOSITORY}/pages -f build_type=workflow"
            exit 1
          fi
          if [ "$build_type" != "workflow" ]; then
            echo "::error::GitHub Pages source is '${build_type}', expected 'workflow' (GitHub Actions). Settings -> Pages -> Source = GitHub Actions."
            exit 1
          fi
          echo "GitHub Pages enabled (build_type=${build_type})"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build the project (elan, Mathlib cache, oleans)
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Write the site-root redirect to the API index
        run: |
          set -euo pipefail
          mkdir -p api-site
          cat > api-site/index.html <<'HTML'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>BimodalLogic API documentation</title>
          <meta http-equiv="refresh" content="0; url=docs/">
          <a href="docs/">BimodalLogic API documentation</a>
          HTML

      - name: Enlarge swap for the doc build
        run: |
          set -euo pipefail
          free -h
          df -h /mnt /
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # See the header: without this the doc build's child-process spawns are refused on commit
      # accounting while physical memory is free.
      - name: Allow memory overcommit
        run: |
          set -euo pipefail
          sudo sysctl -w vm.overcommit_memory=1

      # Prints the memory and overcommit state the build starts from, and starts a sampler
      # whose trace the "Report docgen memory trace" step prints. The sampler is detached
      # (stdin from /dev/null, output to the log, backgrounded and disowned) so it survives
      # this step's shell and never holds the step open.
      - name: Record pre-docgen memory and overcommit state
        run: |
          set -euo pipefail
          echo "--- free -h ---"
          free -h
          echo "--- /proc/meminfo (selected) ---"
          grep -E '^(MemTotal|MemFree|MemAvailable|SwapTotal|SwapFree|Committed_AS|CommitLimit)' /proc/meminfo
          echo "--- sysctl ---"
          sysctl vm.overcommit_memory vm.overcommit_ratio vm.max_map_count
          echo "--- nproc ---"
          nproc
          echo "--- ulimit -a ---"
          ulimit -a
          nohup bash -c '
            while true; do
              {
                echo "=== $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
                grep -E "^(Committed_AS|CommitLimit|MemAvailable|SwapFree)" /proc/meminfo
                ps -eo rss,comm --sort=-rss | head -6
              }
              sleep 15
            done
          ' </dev/null >"$RUNNER_TEMP/docgen-mem.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/docgen-mem.pid"
          disown

      - name: Build and deploy doc-gen4 documentation
        id: docgen
        uses: leanprover-community/docgen-action@56023ee2a4b3630c1071825be5bafdb43f540bbd
        with:
          api-docs: true
          blueprint: false
          build-page: false
          homepage: api-site
          references: references.bib

      # docgen-action saves its docs cache only on job success. This step saves the same key and
      # path list after a failed build, so that the dependency docs already built are not
      # rebuilt, but only when the Mathlib docs are at least 95% complete: the key is
      # immutable, so a small or empty entry would be restored on every later run. Saving under
      # a key that already exists is a no-op.
      - name: Measure the built Mathlib docs
        id: docsize
        if: always()
        run: |
          set -euo pipefail
          n=$(find docbuild/.lake/build/doc/Mathlib -name '*.html' 2>/dev/null | wc -l)
          total=$(find .lake/packages/mathlib/Mathlib -name '*.lean' | wc -l)
          echo "Mathlib doc pages built: $n of $total modules"
          if [ "$total" -gt 0 ] && [ "$n" -ge $(( total * 95 / 100 )) ]; then echo "complete=true" >> "$GITHUB_OUTPUT"; else echo "complete=false" >> "$GITHUB_OUTPUT"; fi

      - name: Persist the Mathlib docs cache even when the doc build fails
        if: always() && steps.docsize.outputs.complete == 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          key: Docs-${{ hashFiles('lake-manifest.json', 'references.bib') }}
          path: |
            docbuild/.lake/build/doc/Mathlib
            docbuild/.lake/build/doc/Archive
            docbuild/.lake/build/doc/Counterexamples
            docbuild/.lake/build/doc/Plausible
            docbuild/.lake/build/doc/LeanSearchClient
            docbuild/.lake/build/doc/ImportGraph
            docbuild/.lake/build/doc/ProofWidgets
            docbuild/.lake/build/doc/Aesop
            docbuild/.lake/build/doc/Qq
            docbuild/.lake/build/doc/Batteries
            docbuild/.lake/build/doc/Cli
            docbuild/.lake/build/doc/Init
            docbuild/.lake/build/doc/Lake
            docbuild/.lake/build/doc/Lean
            docbuild/.lake/build/doc/Std
            docbuild/.lake/build/doc-data
            docbuild/.lake/build/doc/declarations/declaration-data.bmp
            docbuild/.lake/build/api-docs.db
            docbuild/.lake/build/doc-manifest.json
            docbuild/.lake/build/doc/style.css
            docbuild/.lake/build/doc/favicon.svg
            docbuild/.lake/build/doc/declaration-data.js
            docbuild/.lake/build/doc/color-scheme.js
            docbuild/.lake/build/doc/nav.js
            docbuild/.lake/build/doc/jump-src.js
            docbuild/.lake/build/doc/expand-nav.js
            docbuild/.lake/build/doc/how-about.js
            docbuild/.lake/build/doc/search.js
            docbuild/.lake/build/doc/mathjax-config.js
            docbuild/.lake/build/doc/instances.js
            docbuild/.lake/build/doc/importedBy.js
            docbuild/.lake/build/doc/index.html
            docbuild/.lake/build/doc/404.html
            docbuild/.lake/build/doc/navbar.html
            docbuild/.lake/build/doc/search.html
            docbuild/.lake/build/doc/foundational_types.html
            docbuild/.lake/build/doc/references.html
            docbuild/.lake/build/doc/references.bib
            docbuild/.lake/build/doc/tactics.html
            docbuild/.lake/build/doc/find/index.html
            docbuild/.lake/build/doc/find/find.js

      - name: Report docgen memory trace
        if: always()
        run: |
          set -euo pipefail
          kill "$(cat "$RUNNER_TEMP/docgen-mem.pid")" 2>/dev/null || true
          log="$RUNNER_TEMP/docgen-mem.log"
          if [ ! -s "$log" ]; then
            echo "No memory trace log found at $log -- sampler did not produce output."
            exit 0
          fi
          echo "--- peak Committed_AS / CommitLimit observed ---"
          grep -E '^(Committed_AS|CommitLimit):' "$log" | sort -k2 -n -r | awk '{seen[$1]++; if (seen[$1]==1) print}'
          echo "--- peak RSS for any lake/doc-gen4 process ---"
          grep -E 'lake|doc-gen4' "$log" | sort -n -r | head -1 || echo "(none observed)"
          echo "--- final 60 samples ---"
          tail -n 60 "$log"
