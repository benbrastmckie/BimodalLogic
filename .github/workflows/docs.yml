name: API Documentation

# Builds the doc-gen4 API documentation for FormalSystem and deploys it to GitHub Pages at
# https://benbrastmckie.github.io/BimodalLogic/docs/ (module pages such as
# docs/FormalSystem.html; the site root redirects there).
#
# PREREQUISITES (each one was a cause of this workflow failing before):
#   - `lakefile.toml`. leanprover-community/docgen-action reads the package `name` and
#     `defaultTargets` from `lakefile.toml` only, with no fallback for a Lean-syntax lakefile.
#     The package name it reads is the Lake package (`BimodalLogic`), not the library.
#   - `leanprover/lean-action` runs FIRST. docgen-action installs neither elan nor the Mathlib
#     cache itself; it calls `~/.elan/bin/lake` and expects the project to be built already.
#   - Pages source = "GitHub Actions" (Settings -> Pages -> Build and deployment -> Source).
#     A workflow cannot set this for itself; until it is set the deploy step has nowhere to
#     publish. The first step checks it and fails fast.
#   - A `push` event. The action builds the API docs and deploys only on push; a
#     `workflow_dispatch` run exercises the setup steps but publishes nothing.
#   - More memory than a cold run's external-process fan-out needs. The doc build runs
#     `lake build` over roughly 6,300 doc targets, and the measured failure
#     (`error: failed to execute '.../doc-gen4/.lake/build/bin/doc-gen4': resource exhausted
#     (error code: 12, cannot allocate memory)`, 47 of 48 allocation errors in run 44492038639)
#     is Lake failing to SPAWN a doc-gen4 child process -- fork/exec returning ENOMEM -- not
#     Lean exhausting its own in-process heap. doc-gen4 is a separate binary invoked per module,
#     so the governing quantity is Lake's EXTERNAL-PROCESS fan-out, not an in-process thread
#     pool. The failure summary attributes the kill to whichever `srcUri.github` targets were in
#     flight when memory ran out -- those cheap `git`-subprocess jobs are the symptom, not the
#     cause, and no URI or git configuration is involved.
#
#     Root cause: the `docs` library facet cascades `docInfo` into Mathlib's entire import
#     closure, and that ~6,300-target fan-out recurs in full on every run because
#     `actions/cache`'s save (post) action inside `docgen-action` is declared
#     `post-if: "success()"`, and this job has never reached `success` -- directly observed as
#     `outcome=skipped;conclusion=skipped` on the "Cache Mathlib docs" post-action in run
#     44492038639. `docgen-action`'s internal Mathlib-docs cache has therefore never been
#     populated, and every run cold-builds the same ~6,300 targets. The "Persist the Mathlib
#     docs cache even when the doc build fails" step below closes this gate: it replicates the
#     internal cache's own key and path list in an independently-gated save (`if: always()`)
#     that fires regardless of job outcome.
#
#     Closed routes, measured and not to be re-tried:
#       - `LEAN_NUM_THREADS: "1"` (caps the in-process Task thread pool, the wrong quantity for
#         an external-process fan-out). Run 44492038639, commit 3bd8b2b31: the variable reached
#         the build correctly, yet produced 48 allocation errors against 13 on run 44457344329
#         and 15 on run 44477674624, and docgen wall-clock rose to 13m20s from 8-10 minutes.
#       - Swap enlargement. The swap step below takes this runner from 3 GiB to 15 GiB of swap
#         alongside 15 GiB of RAM -- confirmed active by the step's own `free -h` output -- and
#         a build still dies with double-digit allocation errors. The step is kept because
#         headroom is cheap and its `free -h`/`df -h` output makes any shortfall name itself in
#         the log.
#       - A larger GitHub-hosted runner. Unavailable to this personal-account repository at any
#         plan tier; larger runners are organization/enterprise-only.
#       - Lake job-count flags. Lake 5.0.0 accepts no `-j`/`--jobs` (`lake build -j2` ->
#         `unknown short option '-j'`; `--jobs=2` -> `unknown long option '--jobs'`), and the
#         doc build's own `lake build` call lives inside the pinned action's
#         `scripts/build_docs.sh`, not in `build-args` here.
#
#     Two-run convergence: the first push after this cache-save step lands is still cold and may
#     still fail, but for the first time it populates the cache. The second push should restore
#     it (`Cache restored from key: Docs-a123379d...` in the log) and shrink the fan-out to
#     `FormalSystem`'s own modules, with a materially shorter docgen step.
#
#     Escalation ladder, in order, if a warm-cache run still OOMs: first, read the "Record
#     pre-docgen memory and overcommit state" / "Report docgen memory trace" steps' log, and
#     only if `Committed_AS` approaches `CommitLimit` at the moment of failure, add
#     `sudo sysctl -w vm.overcommit_memory=1` (or raise `vm.overcommit_ratio`) in a step before
#     the doc build -- this is conditional on that measurement, not a default action. Second, if
#     `FormalSystem`'s own fan-out still OOMs on a warm cache, drive `doc-gen4`'s own
#     `single`/`fromDb` subcommands directly over `find FormalSystem -name '*.lean'` with an
#     explicit `xargs -P N`, as `linglib-community/linglib` does in production (its commit
#     `97ec249684`; the CLI surface is confirmed present at `doc-gen4` tag `v4.33.0-rc1`, the tag
#     `build_docs.sh`'s `determine_doc_gen_rev` resolves to for this `lean-toolchain`).
#
#     Path-list maintenance: the cache-save step's `path:` list below is copied verbatim from
#     `docgen-action`'s own echoed `path:` input in run 44492038639's log, not derived. "One
#     `docbuild/.lake/build/doc/<PackageName>` directory per `lake-manifest.json` package, plus
#     the four implicit core modules" is an approximate hint only -- it omits `Archive` and
#     `Counterexamples` (not `lake-manifest.json` packages) and differs in capitalization from
#     the manifest's package names. Revisit the list after any `lake update` that changes the
#     dependency set.
#
# The action supplies doc-gen4 itself (a throwaway `docbuild/` package pinned to the doc-gen4
# tag matching `lean-toolchain`), which is why `lakefile.toml` and `lake-manifest.json` carry no
# doc-gen4 dependency and must not acquire one: adding it would put doc-gen4 into every
# contributor's `lake build` for the sake of a job that only runs here.
#
# `homepage: api-site` and `build-page: false` are load-bearing, not defaults being restated.
# The action copies the generated API into `<homepage>/docs` and uploads the whole `<homepage>`
# folder. Its default `homepage` is `docs`, which in this repository is a hand-maintained tree of
# markdown files: the default would publish that tree with the API nested at `/docs/docs/`.
# `api-site` is a folder that does not exist in the repository, created only inside this job, so
# the published site holds the API documentation and the one-line redirect written below, and
# nothing else. `build-page: false` skips the Jekyll build, since there is no Jekyll site. The
# upgrade path, if a landing page is ever wanted, is a real Jekyll site in a new folder named by
# `homepage` -- never `docs`.
#
# docgen-action is pinned to a commit SHA rather than `@main`, so an upstream change cannot alter
# what this job publishes without a reviewed edit here.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes an older queued run but never cancels a
# deploy already in flight.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  docs:
    name: Build and deploy API documentation
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.docgen.outputs.page_url }}

    steps:
      # Fail in seconds, not after the ~90-minute doc build, when the Pages prerequisite above is
      # unmet: deploy-pages otherwise reports only an opaque `HttpError: Not Found` at the very
      # last step. `pages: write` covers this read.
      - name: Check GitHub Pages is enabled with source "GitHub Actions"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type); then
            echo "::error::GitHub Pages is not enabled. Settings -> Pages -> Source = GitHub Actions, or: gh api -X POST repos/${GITHUB_REPOSITORY}/pages -f build_type=workflow"
            exit 1
          fi
          if [ "$build_type" != "workflow" ]; then
            echo "::error::GitHub Pages source is '${build_type}', expected 'workflow' (GitHub Actions). Settings -> Pages -> Source = GitHub Actions."
            exit 1
          fi
          echo "GitHub Pages enabled (build_type=${build_type})"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build the project (elan, Mathlib cache, oleans)
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Write the site-root redirect to the API index
        run: |
          set -euo pipefail
          mkdir -p api-site
          cat > api-site/index.html <<'HTML'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>BimodalLogic API documentation</title>
          <meta http-equiv="refresh" content="0; url=docs/">
          <a href="docs/">BimodalLogic API documentation</a>
          HTML

      - name: Enlarge swap for the doc build
        run: |
          set -euo pipefail
          free -h
          df -h /mnt /
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # Answers one question the three prior failing runs' logs could not settle: whether
      # fork() is being refused under heuristic overcommit while apparent headroom remains
      # (vm.overcommit_memory heuristic refusing a fork from an already-large parent), which
      # would make the parent's resident size the lever rather than external-process count.
      # The background sampler is detached (stdin from /dev/null, stdout+stderr to the log,
      # backgrounded and disowned) so it survives this step's shell exiting and never holds
      # the step open.
      - name: Record pre-docgen memory and overcommit state
        run: |
          set -euo pipefail
          echo "--- free -h ---"
          free -h
          echo "--- /proc/meminfo (selected) ---"
          grep -E '^(MemTotal|MemFree|MemAvailable|SwapTotal|SwapFree|Committed_AS|CommitLimit)' /proc/meminfo
          echo "--- sysctl ---"
          sysctl vm.overcommit_memory vm.overcommit_ratio vm.max_map_count
          echo "--- nproc ---"
          nproc
          echo "--- ulimit -a ---"
          ulimit -a
          nohup bash -c '
            while true; do
              {
                echo "=== $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
                grep -E "^(Committed_AS|CommitLimit|MemAvailable|SwapFree)" /proc/meminfo
                ps -eo rss,comm --sort=-rss | head -6
              }
              sleep 15
            done
          ' </dev/null >"$RUNNER_TEMP/docgen-mem.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/docgen-mem.pid"
          disown

      - name: Build and deploy doc-gen4 documentation
        id: docgen
        uses: leanprover-community/docgen-action@56023ee2a4b3630c1071825be5bafdb43f540bbd
        with:
          api-docs: true
          blueprint: false
          build-page: false
          homepage: api-site
          references: references.bib

      # actions/cache's own save (post) action inside docgen-action is gated post-if:
      # "success()", and this job has never reached success -- directly observed as
      # outcome=skipped;conclusion=skipped on the "Cache Mathlib docs" post-action in run
      # 44492038639 -- so docgen-action's internal Mathlib-docs cache has never been populated,
      # and every run re-builds the full ~6,300-target fan-out from cold. This step replicates
      # that internal cache's own key and path list (recovered verbatim from the "Cache Mathlib
      # docs" step's echoed `with:` input in that same run's log) in an independently-gated save
      # that fires regardless of job outcome, so a failing run still persists the dependency
      # docs it already built. actions/cache/save under an already-populated key is a safe
      # no-op, so this never conflicts with a future run where the internal save does fire.
      # Placed before "Report docgen memory trace" deliberately: in the failure path this job
      # always takes today, the cache save is attempted first, ahead of anything else.
      - name: Persist the Mathlib docs cache even when the doc build fails
        if: always()
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          key: Docs-${{ hashFiles('lake-manifest.json', 'references.bib') }}
          path: |
            docbuild/.lake/build/doc/Mathlib
            docbuild/.lake/build/doc/Archive
            docbuild/.lake/build/doc/Counterexamples
            docbuild/.lake/build/doc/Plausible
            docbuild/.lake/build/doc/LeanSearchClient
            docbuild/.lake/build/doc/ImportGraph
            docbuild/.lake/build/doc/ProofWidgets
            docbuild/.lake/build/doc/Aesop
            docbuild/.lake/build/doc/Qq
            docbuild/.lake/build/doc/Batteries
            docbuild/.lake/build/doc/Cli
            docbuild/.lake/build/doc/Init
            docbuild/.lake/build/doc/Lake
            docbuild/.lake/build/doc/Lean
            docbuild/.lake/build/doc/Std
            docbuild/.lake/build/doc-data
            docbuild/.lake/build/doc/declarations/declaration-data.bmp
            docbuild/.lake/build/api-docs.db
            docbuild/.lake/build/doc-manifest.json
            docbuild/.lake/build/doc/style.css
            docbuild/.lake/build/doc/favicon.svg
            docbuild/.lake/build/doc/declaration-data.js
            docbuild/.lake/build/doc/color-scheme.js
            docbuild/.lake/build/doc/nav.js
            docbuild/.lake/build/doc/jump-src.js
            docbuild/.lake/build/doc/expand-nav.js
            docbuild/.lake/build/doc/how-about.js
            docbuild/.lake/build/doc/search.js
            docbuild/.lake/build/doc/mathjax-config.js
            docbuild/.lake/build/doc/instances.js
            docbuild/.lake/build/doc/importedBy.js
            docbuild/.lake/build/doc/index.html
            docbuild/.lake/build/doc/404.html
            docbuild/.lake/build/doc/navbar.html
            docbuild/.lake/build/doc/search.html
            docbuild/.lake/build/doc/foundational_types.html
            docbuild/.lake/build/doc/references.html
            docbuild/.lake/build/doc/references.bib
            docbuild/.lake/build/doc/tactics.html
            docbuild/.lake/build/doc/find/index.html
            docbuild/.lake/build/doc/find/find.js

      - name: Report docgen memory trace
        if: always()
        run: |
          set -euo pipefail
          kill "$(cat "$RUNNER_TEMP/docgen-mem.pid")" 2>/dev/null || true
          log="$RUNNER_TEMP/docgen-mem.log"
          if [ ! -s "$log" ]; then
            echo "No memory trace log found at $log -- sampler did not produce output."
            exit 0
          fi
          echo "--- peak Committed_AS / CommitLimit observed ---"
          grep -E '^(Committed_AS|CommitLimit):' "$log" | sort -k2 -n -r | awk '{seen[$1]++; if (seen[$1]==1) print}'
          echo "--- peak RSS for any lake/doc-gen4 process ---"
          grep -E 'lake|doc-gen4' "$log" | sort -n -r | head -1 || echo "(none observed)"
          echo "--- final 60 samples ---"
          tail -n 60 "$log"
