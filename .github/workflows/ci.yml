# See docs/development/CI_CD_PROCESS.md's "Wiring a New Check Script" section for the
# per-script wiring pattern (step naming, skip-and-report-neutral convention, cache-warm
# placement, runtime budget) that every step below follows. A new check step is appended
# directly before "Report results".
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build, test, and lint with Lean
        id: lean-action
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: true
          # The Batteries env_linter set (simpNF, docBlame, defsWithUnderscore,
          # structureInType, tacticDocs, unusedArguments) cannot be narrowed via lint-args --
          # runLinter's own CLI always runs every registered linter unconditionally, with no
          # selection flag. scripts/nolints.json grandfathers the 217 pre-existing findings
          # (the standard Batteries/Mathlib mechanism, read on every run), so `lake lint` now
          # fails only on a genuinely NEW finding. All 217 are `unusedArguments`, permanently
          # grandfathered on measured evidence -- see
          # docs/development/NAMING_CONVENTION_DEVIATION.md; every other category was burned
          # down to genuine conformance rather than suppressed. dupNamespace (a separate Lean
          # core text linter, now 0 findings) never reaches the driver's report or its exit
          # code either way.
          lint: true
          use-mathlib-cache: true

      # Every `lean_exe` root in lakefile.lean sits outside both library root closures, so the
      # `build: true` step above never elaborates any of them: nothing imports them, and
      # `lake build` only walks what is reachable from `FormalSystem` and `BimodalTest`.
      # FormalSystem/Automation/ProofExtractorMain.lean (then ProofStepExport.lean) failed to elaborate for an extended period
      # with `lake exe proof_extractor` simply broken and CI green throughout, because no step
      # here could observe it. Marking the exe targets `@[default_target]` was rejected on
      # measured cost -- 240-310 MB of linked binary per root, thirteen of them. These are
      # MODULE targets: elaboration and C emission, no linking, reusing the cache the
      # lean-action step above already populated. C25 in scripts/check-module-invariants.sh is
      # the full-mode counterpart of this same root-list scrape; CI itself runs the structural
      # (--no-build) pass in the "Check module invariants" step below, which skips C25 (and
      # C1, C24) as already covered by this step and by lean-action.
      - name: Compile lean_exe roots (outside the library closures)
        run: |
          set -euo pipefail
          roots=$(grep -oP 'root\s*:=\s*`\K[A-Za-z0-9_.]+' lakefile.lean)
          test -n "$roots"
          for root in $roots; do
            echo "::group::lake build $root"
            lake build "$root"
            echo "::endgroup::"
          done

      # The bi-lasso evidence probes under specs/evidence/ are machine-checked records of design
      # obstructions. They live outside every Lake root, so neither step above ever elaborates
      # them, and they have already rotted undetected once: an API refactor broke all four with
      # nothing announcing it. DECISION: a rotted probe FAILS CI rather than merely reporting,
      # because a probe that no longer compiles no longer protects the design decision it records
      # (see the header of scripts/check-evidence-probes.sh). Every probe import is inside the
      # FormalSystem import closure, so this reuses the cache the lean-action step populated.
      - name: check-evidence-probes.sh
        run: |
          set -euo pipefail
          echo "::group::bash scripts/check-evidence-probes.sh"
          bash scripts/check-evidence-probes.sh
          echo "::endgroup::"

      # Structural pass only (--no-build): C1/C16-full/C25 duplicate work the lean-action and
      # lean_exe steps above already do, and C2/C6/C24 are the resulting known gaps -- see
      # docs/development/CI_CD_PROCESS.md's "Wiring a New Check Script" section for the full
      # cache-warm-placement rule new steps here should follow.
      - name: Check module invariants (scripts/check-module-invariants.sh --no-build)
        run: |
          set -euo pipefail
          echo "::group::bash scripts/check-module-invariants.sh --no-build"
          bash scripts/check-module-invariants.sh --no-build
          echo "::endgroup::"

      - name: Check copyright headers (scripts/check-copyright-headers.sh --strict)
        run: |
          set -euo pipefail
          echo "::group::bash scripts/check-copyright-headers.sh --strict --exclude '*/Boneyard/*' FormalSystem"
          bash scripts/check-copyright-headers.sh --strict --exclude '*/Boneyard/*' FormalSystem
          echo "::endgroup::"

      - name: Check README health (scripts/readme-lint.sh)
        run: |
          set -euo pipefail
          echo "::group::bash scripts/readme-lint.sh"
          bash scripts/readme-lint.sh
          echo "::endgroup::"

      # Metalogic/ is allowed exactly one directory-level import cycle (BXCanonical <->
      # WeakCanonical, accepted in docs/architecture/ADR-006-Metalogic-No-Physical-Regroup.md).
      # The script fails on any other count. It runs here because a second cycle once landed
      # and went unnoticed for about a hundred commits while the script was only run by hand.
      # Pure grep over import lines: no lake, no cache dependency.
      - name: Check Metalogic directory-level import cycles (scripts/check-metalogic-cycles.sh)
        run: |
          set -euo pipefail
          echo "::group::bash scripts/check-metalogic-cycles.sh"
          bash scripts/check-metalogic-cycles.sh
          echo "::endgroup::"

      - name: Report results
        if: always()
        run: |
          echo "Build status: ${{ steps.lean-action.outputs.build-status }}"
          echo "Test status: ${{ steps.lean-action.outputs.test-status }}"
          echo "Lint status: ${{ steps.lean-action.outputs.lint-status }}"
