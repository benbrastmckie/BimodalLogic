# Lake configuration for the BimodalLogic package.
#
# The package is named after the repository; the main library is `FormalSystem` and the test
# library `BimodalTest`. Two further libraries carry the tooling half: `BimodalTools` (the
# dataset / ML / benchmark modules and the 13 executable roots) and `BimodalToolsTest` (their
# tests). `BimodalTools` is DELIBERATELY absent from `defaultTargets`: a plain `lake build`
# must compile the published library and nothing else, so the tooling is built only by an
# explicit `lake build BimodalTools` / `lake build BimodalToolsTest` or by a `lake exe` target.
# Check B3 asserts the separation holds in the import direction (`FormalSystem` never imports
# `BimodalTools`); the converse direction is sanctioned and ungated.
# This file is declarative TOML (not a Lean-syntax lakefile) because
# leanprover-community/docgen-action, used by .github/workflows/docs.yml, reads only
# `lakefile.toml`. Scripts that need the declared targets read this file through
# scripts/lake_targets.py rather than scraping it with their own regex.
#
# Defaults Lake applies and this file therefore omits: a library's `srcDir` is "." and its
# `roots` is `[name]`; an executable's `srcDir` is ".".

name = "BimodalLogic"
testDriver = "BimodalTest"
lintDriver = "batteries/runLinter"
defaultTargets = ["FormalSystem"]

# Package-level Lean options: Mathlib's standard syntax-linter set, plus the length limit that
# switches on the long-file linter (it is inert at its default of 0). These live at package level,
# not in each `[[lean_lib]]`, because the `[[lean_exe]]` roots below do not inherit a library's
# `leanOptions`; package options reach every target. The `weak.` prefix makes an option that an
# upstream package does not define a no-op instead of an error. See the lint-suppression policy in
# docs/development/LEAN_STYLE_GUIDE.md for what is enabled and every permanent opt-out.
[leanOptions]
weak.linter.mathlibStandardSet = true
# A file over this limit carries an in-source baseline, `set_option linter.style.longFile N`,
# after its module docstring; the linter itself checks that N stays tight.
weak.linter.style.longFile = 1500
# Permanent opt-out: Mathlib's unicode allowlist linter is off. It is a TEXT linter -- it never
# runs during a build; `lake exe lint-style` (and the lint-style CI step) runs it, and reads this
# block to decide whether to. Its allowlist is Mathlib's own, and this library's documented,
# load-bearing notation is not on it: measured at adoption, 258 findings, led by the
# limit-closure diamond `⟐` (115), the combining vector arrow of `v⃗` (74), `⟺` (28) and `Ĝ`
# (23). The alternative -- respelling the paper's notation to satisfy another project's
# allowlist -- was rejected. Every other lint-style text linter is adopted at its default. See
# the lint-suppression policy in docs/development/LEAN_STYLE_GUIDE.md.
weak.linter.unicodeLinter = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "FormalSystem"
leanOptions = {pp.unicode.fun = true, autoImplicit = false}

# Permanent opt-out: the `#`-command linter is off for the test library only. Its `#eval`,
# `#guard` and `#check` probes are the content of those files, not development leftovers. A
# library-level option overrides the package-level set (Lake appends library options after the
# package's, and a later entry wins).
[[lean_lib]]
name = "BimodalTest"
srcDir = "Tests"
leanOptions = {pp.unicode.fun = true, autoImplicit = false, weak.linter.hashCommand = false}

# The tooling library: dataset generation, ML export, benchmarks, and the roots of the 13
# `lean_exe` targets below. Absent from `defaultTargets` on purpose -- see the header comment.
[[lean_lib]]
name = "BimodalTools"
leanOptions = {pp.unicode.fun = true, autoImplicit = false}

# Tests for the tooling library. Same `#`-command opt-out as `BimodalTest`: the moved tooling
# tests are `#guard` / `#eval` probes, which is their content and not development leftovers.
[[lean_lib]]
name = "BimodalToolsTest"
srcDir = "Tests"
leanOptions = {pp.unicode.fun = true, autoImplicit = false, weak.linter.hashCommand = false}

# Dataset generator executable for ML training data.
# Run with: lake exe dataset_generator -- --max-complexity 5 --output data/bmlogic.jsonl
[[lean_exe]]
name = "dataset_generator"
root = "BimodalTools.DatasetGeneratorMain"
supportInterpreter = true

# Dataset validator executable for conformance testing and feasibility gate.
# Run with: lake exe dataset_validator
[[lean_exe]]
name = "dataset_validator"
root = "BimodalTools.DatasetValidatorMain"
supportInterpreter = true

# Proof step extractor for BimodalHarness training data.
# Run with: lake exe proof_extractor -- --output data/proof_steps.jsonl
[[lean_exe]]
name = "proof_extractor"
root = "BimodalTools.ProofExtractorMain"
supportInterpreter = true

# Enumerator benchmark: validates complexity 5-7 feasibility gates.
# Run with: lake exe enum_benchmark
[[lean_exe]]
name = "enum_benchmark"
root = "BimodalTools.EnumBenchmarkMain"
supportInterpreter = true

# Benchmark anchor generator: produces axiom instances for BMLogic-Bench.
# Run with: lake exe benchmark_anchors -- --output data/axiom-instances.jsonl
[[lean_exe]]
name = "benchmark_anchors"
root = "BimodalTools.BenchmarkAnchorsMain"
supportInterpreter = true

# Benchmark oracle: validates formula labels via decision procedure.
# Run with: lake exe benchmark_oracle -- --input data/bmlogic-bench-candidates.jsonl --output data/bmlogic-bench-validated.jsonl
[[lean_exe]]
name = "benchmark_oracle"
root = "BimodalTools.BenchmarkOracleMain"
supportInterpreter = true

# Contrastive pair generator for dual-verification training signal.
# Run with: lake exe contrastive_generator -- --max-complexity 5 --output data/contrastive_pairs.jsonl
[[lean_exe]]
name = "contrastive_generator"
root = "BimodalTools.ContrastiveGeneratorMain"
supportInterpreter = true

# Tableau bridge REPL for live formula queries.
# Run with: lake exe tableau_bridge
# Then send JSONL requests on stdin, one per line.
[[lean_exe]]
name = "tableau_bridge"
root = "BimodalTools.TableauBridgeMain"
supportInterpreter = true

# Tableau-derived proof step pipeline for large-scale training data.
# Run with: lake exe tableau_proof_steps -- --max-complexity 7 --output data/tableau_proof_steps.jsonl
[[lean_exe]]
name = "tableau_proof_steps"
root = "BimodalTools.TableauProofStepsMain"
supportInterpreter = true

# Trace certificate exporter: emits JSONL proof certificates.
# Run with: echo '{"command":"trace_decide","formula":{"tag":"atom","name":"p"}}' | lake exe trace_exporter
[[lean_exe]]
name = "trace_exporter"
root = "BimodalTools.TraceExporterMain"
supportInterpreter = true

# Proof-first generator: forward-chains from axioms, emits JSONL theorems.
# Run with: lake exe proof_first_generator -- --max-depth 2 --seed 1000 --output data/proof_first.jsonl
[[lean_exe]]
name = "proof_first_generator"
root = "BimodalTools.ProofFirstGeneratorMain"
supportInterpreter = true

# Machine-readable axiomatization appendix exporter.
# Run with: lake exe machine_appendix -- --output typst/generated/machine-appendix.jsonl --stamp-commit SHA --stamp-date DATE
# Normally invoked via scripts/typst-machine-appendix.sh (injects git stamps).
[[lean_exe]]
name = "machine_appendix"
root = "BimodalTools.MachineAppendixMain"
supportInterpreter = true

# Witness-family certificate re-verification: reads one certificate on stdin, prints one JSON line.
# Run with: echo '{"premises":[...],"conclusions":[...],"bx":[...],"lassos":[...]}' | lake exe check_certificate
[[lean_exe]]
name = "check_certificate"
root = "BimodalTools.CheckCertificateMain"
supportInterpreter = true

# Reports FormalSystem modules that do not (transitively) import FormalSystem.Init.
# Run with: lake exe checkInitImports
[[lean_exe]]
name = "checkInitImports"
srcDir = "scripts"
root = "CheckInitImportsMain"
supportInterpreter = true
