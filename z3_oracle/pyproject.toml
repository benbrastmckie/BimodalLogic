[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bmlogic-z3-oracle"
version = "0.1.0"
description = "Z3-based countermodel generator for bimodal TM logic (negative training signal)"
authors = [
    {name = "BimodalLogic Project"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "z3-solver>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
]

[project.entry-points."bimodal_harness.oracle_providers"]
z3_oracle = "bmlogic_oracle.provider:Z3OracleProvider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
